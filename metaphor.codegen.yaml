# Codegen policy for telephony.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  - "src/application/service/telephony_events.rs"
  - "src/application/service/telephony_write_service.rs"
  # Owns the hand-written Call SQL (the CDR dedup probe + idempotent insert + subject link) that the
  # write service orchestrates. Declared here — not renamed with a `_custom` suffix — so the generator
  # skips it wholesale; this declaration is what makes editing it legitimate.
  - "src/infrastructure/persistence/call_repository.rs"
  # The validated write HTTP surface — serves TelephonyWriteService (CDR ingest + subject link) as
  # the production alternative to unguarded generic CRUD. Hand-authored; declared here so the
  # generator skips it wholesale.
  - "src/presentation/http/telephony_write_handler.rs"
  - "tests/integrity_probes.rs"
  - "tests/telephony_golden_cases.rs"
  - "tests/validated_write_routes.rs"
  # Shared probe helpers (pool, clocks, event sinks, the scoped-request wrapper the durable-event
  # path needs) — hand-written alongside the probe files above.
  - "tests/common/**"
  # NOTE: the cross-module MissedCall→CRM-callback-lead seam lives at the WORKSPACE level
  # (seams/telephony-crm-seam), not in this crate — it links the real backbone-crm module, which is
  # a sibling that is not always checked out. Keeping it out of this crate keeps the module
  # self-contained and buildable standalone.
  - "scripts/**"
  # The curated workflow module: the generated example saga scaffold was deliberately removed;
  # own the directory so regeneration does not resurrect it.
  - "src/application/workflows/**"
  # Hand-authored migrations (the guarded company-artifact strip — the strip's ordering guard
  # is hand-authored logic, not schema-derived emission).
  - "migrations/20260909120000_strip_tenancy.up.sql"
  - "migrations/20260909120000_strip_tenancy.down.sql"
  # Hand-authored behavior (services + their HTTP surface). Examples:
  # - "src/application/service/onboarding_service.rs"
  # - "src/presentation/http/guarded_routes.rs"

  # Behavior tests (the golden cases / oracle) + BDD features.
  - "tests/features/**"
  # - "tests/*_golden_cases.rs"
  # - "tests/integrity_probes.rs"

  # Hand-authored module documentation.
  - "docs/**"
