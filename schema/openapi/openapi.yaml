openapi: '3.0.3'
info:
  title: Backbone API
  version: '1.0.0'
  description: |
    Auto-generated by backbone-cli.
    This API provides 11 standard CRUD endpoints for each model.

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Calls
    description: Call management endpoints

paths:
  /api/v1/calls:
    get:
      tags:
        - Calls
      summary: List Calls
      description: Get a paginated list of Calls with optional filtering and sorting
      operationId: listCalls
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Calls
      summary: Create Call
      description: Create a new Call
      operationId: createCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCallRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/calls/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'

    get:
      tags:
        - Calls
      summary: Get Call by ID
      operationId: getCall
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Calls
      summary: Update Call (full)
      operationId: updateCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCallRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Calls
      summary: Update Call (partial)
      operationId: patchCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCallRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Calls
      summary: Delete Call (soft)
      operationId: deleteCall
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/calls/bulk:
    post:
      tags:
        - Calls
      summary: Bulk create Calls
      operationId: bulkCreateCalls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateCallRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Call'
    put:
      tags:
        - Calls
      summary: Bulk update Calls (full, atomic)
      operationId: bulkUpdateCalls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                allOf:
                  - type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                  - $ref: '#/components/schemas/UpdateCallRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'
    patch:
      tags:
        - Calls
      summary: Bulk partial-update Calls (atomic)
      operationId: bulkPatchCalls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ids, patch]
                  properties:
                    ids:
                      type: array
                      items: { type: string }
                    patch:
                      type: object
                      additionalProperties: true
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                        required: [id, patch]
                        properties:
                          id: { type: string }
                          patch: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/calls/upsert:
    post:
      tags:
        - Calls
      summary: Upsert Call
      operationId: upsertCall
      parameters:
        - name: key_field
          in: query
          schema:
            type: string
        - name: key_value
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCallRequest'
      responses:
        '200':
          description: Upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'

  /api/v1/calls/trash:
    get:
      tags:
        - Calls
      summary: List deleted Calls
      operationId: listDeletedCalls
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallList'

  /api/v1/calls/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags:
        - Calls
      summary: Restore deleted Call
      operationId: restoreCall
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/calls/empty:
    delete:
      tags:
        - Calls
      summary: Empty trash for Calls
      operationId: emptyTrashCalls
      responses:
        '200':
          description: Trash emptied
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_count:
                    type: integer

  /api/v1/calls/delete/bulk:
    post:
      tags:
        - Calls
      summary: Bulk soft-delete Calls by ids (atomic)
      operationId: bulkDeleteCalls
      requestBody:
        $ref: '#/components/requestBodies/BatchIds'
      responses:
        '200':
          description: Soft-deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  soft_deleted: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/calls/restore/bulk:
    post:
      tags:
        - Calls
      summary: Bulk restore Calls by ids (atomic)
      operationId: bulkRestoreCalls
      requestBody:
        $ref: '#/components/requestBodies/BatchIds'
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/calls/restore/all:
    post:
      tags:
        - Calls
      summary: Restore all soft-deleted Calls
      operationId: restoreAllCalls
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored: { type: integer }

  /api/v1/calls/trash/bulk:
    delete:
      tags:
        - Calls
      summary: Bulk permanently-delete Calls from trash by ids (atomic)
      operationId: bulkPermanentDeleteCalls
      requestBody:
        $ref: '#/components/requestBodies/BatchIds'
      responses:
        '200':
          description: Permanently deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  permanently_deleted: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  schemas:
    Call:
      type: object
      required:
        - id
        - direction
        - from_number
        - to_number
        - status
        - started_at
        - duration_seconds
        - metadata
      properties:
        id:
          type: string
          format: uuid
        direction:
          type: string
        from_number:
          type: string
        to_number:
          type: string
        party_id:
          nullable: true
          type: string
          format: uuid
        agent_id:
          nullable: true
          type: string
          format: uuid
        status:
          type: string
        external_id:
          nullable: true
          type: string
        subject_type:
          nullable: true
          type: string
        subject_id:
          nullable: true
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        answered_at:
          nullable: true
          type: string
          format: date-time
        ended_at:
          nullable: true
          type: string
          format: date-time
        duration_seconds:
          type: integer
          format: int32
        recording_url:
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
        metadata:
          type: object

    CallBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Call'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreateCallRequest:
      type: object
      required:
        - direction
        - from_number
        - to_number
        - status
        - started_at
        - duration_seconds
        - metadata
      properties:
        direction:
          type: string
        from_number:
          type: string
        to_number:
          type: string
        party_id:
          nullable: true
          type: string
          format: uuid
        agent_id:
          nullable: true
          type: string
          format: uuid
        status:
          type: string
        external_id:
          nullable: true
          type: string
        subject_type:
          nullable: true
          type: string
        subject_id:
          nullable: true
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        answered_at:
          nullable: true
          type: string
          format: date-time
        ended_at:
          nullable: true
          type: string
          format: date-time
        duration_seconds:
          type: integer
          format: int32
        recording_url:
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
        metadata:
          type: object

    UpdateCallRequest:
      type: object
      required:
        - direction
        - from_number
        - to_number
        - status
        - started_at
        - duration_seconds
        - metadata
      properties:
        direction:
          type: string
        from_number:
          type: string
        to_number:
          type: string
        party_id:
          nullable: true
          type: string
          format: uuid
        agent_id:
          nullable: true
          type: string
          format: uuid
        status:
          type: string
        external_id:
          nullable: true
          type: string
        subject_type:
          nullable: true
          type: string
        subject_id:
          nullable: true
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        answered_at:
          nullable: true
          type: string
          format: date-time
        ended_at:
          nullable: true
          type: string
          format: date-time
        duration_seconds:
          type: integer
          format: int32
        recording_url:
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
        metadata:
          type: object

    PatchCallRequest:
      type: object
      properties:
        direction:
          type: string
        from_number:
          type: string
        to_number:
          type: string
        party_id:
          nullable: true
          type: string
          format: uuid
        agent_id:
          nullable: true
          type: string
          format: uuid
        status:
          type: string
        external_id:
          nullable: true
          type: string
        subject_type:
          nullable: true
          type: string
        subject_id:
          nullable: true
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        answered_at:
          nullable: true
          type: string
          format: date-time
        ended_at:
          nullable: true
          type: string
          format: date-time
        duration_seconds:
          type: integer
          format: int32
        recording_url:
          nullable: true
          type: string
        notes:
          nullable: true
          type: string
        metadata:
          type: object

    CallList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Call'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total_pages:
          type: integer
          example: 5

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid input data
        details:
          type: object
          additionalProperties: true

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SortByParam:
      name: sort_by
      in: query
      schema:
        type: string

    SortOrderParam:
      name: sort_order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  requestBodies:
    BatchIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids:
                type: array
                items: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
